# Configuração do Cloudflare Pages. Com este arquivo no repositório, as ligações
# (banco de dados) abaixo passam a valer no lugar das definidas no painel da Cloudflare.
# A chave dos aparelhos (CHAVE_OPERADOR) e a senha do painel (SENHA_ADMIN) são segredos:
# cadastre-as no painel da Cloudflare, nunca aqui.
# Deve ser igual ao nome do projeto no Cloudflare Pages
name = "roleta-eventos"
pages_build_output_dir = "."
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "roleta-cf"
database_id = "PREENCHER-COM-O-ID-DO-BANCO"
migrations_dir = "migrations"
